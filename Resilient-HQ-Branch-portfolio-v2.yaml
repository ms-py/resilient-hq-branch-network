lab:
  description: 'Two-site enterprise lab: VLANs, router-on-a-stick, OSPF, ACLs and WAN failover.'
  notes: 'Training and LinkedIn portfolio project. Portfolio copy includes extracted device configurations.
    Set host PASSWORD placeholders locally before starting. Switch VLAN definitions were added from the
    verified design because extraction omitted the VLAN database.

    HQ allocation 10.10.0.0/16; branch 10.11.0.0/16; WAN reserve 10.255.0.0/16.

    HQ VLAN10 employees 10.10.0.0/22 GW 10.10.0.1; VLAN20 servers 10.10.4.0/22 GW 10.10.4.1; VLAN30 guests
    10.10.8.0/22 GW 10.10.8.1; VLAN99 management 10.10.12.0/24 GW 10.10.12.1.

    Branch VLAN10 employees 10.11.0.0/22 GW 10.11.0.1; VLAN99 management 10.11.12.0/24 GW 10.11.12.1.

    WAN HQ-Branch 10.255.0.0/30 HQ .1 Branch .2; HQ-Transit 10.255.0.4/30 HQ .5 Transit .6; Transit-Branch
    10.255.0.8/30 Transit .9 Branch .10.

    Target: single-area OSPF area0, prefer direct link using explicit costs; passive LAN interfaces. No
    site summarization in this single-area design.

    Stages: VLANs/trunks, router subinterfaces/hosts, WAN/OSPF, ACLs, measured failover.

    Hosts planned: HQ-PC 10.10.0.10/22; HQ-SERVER 10.10.4.10/22; HQ-GUEST 10.10.8.10/22; BRANCH-PC 10.11.0.10/22.'
  title: Resilient HQ and Branch - Portable Validation
